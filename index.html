---
layout: default
---
<div class="recipe-grid">
  {% for post in paginator.posts limit:12 %}
  <a class="recipe-card" href="{{ post.url | relative_url }}">
    {% if post.image %}
      <img src="{{ post.image | relative_url }}" alt="{{ post.title }}">
    {% endif %}
    <h3>{{ post.title }}</h3>
  </a>
  {% endfor %}

  <nav class="pagination">
  {% if paginator.previous_page %}
    <a href="{{ paginator.previous_page_path | relative_url }}">&laquo; Newer</a>
  {% endif %}

  <span>Page {{ paginator.page }} of {{ paginator.total_pages }}</span>

  {% if paginator.next_page %}
    <a href="{{ paginator.next_page_path | relative_url }}">Older &raquo;</a>
  {% endif %}
  </nav>
</div>
